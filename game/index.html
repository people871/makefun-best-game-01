<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOIDHARVEST — harvest the nebula, survive 10 waves</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #030409;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  #wrap {
    position: relative;
    width: 1280px;
    height: 720px;
    max-width: 100vw;
    max-height: 100vh;
    aspect-ratio: 16 / 9;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    background: #070818;
    cursor: crosshair;
  }
  #hint {
    position: absolute;
    left: 50%;
    bottom: 8px;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.4);
    font-size: 12px;
    pointer-events: none;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="hint">WASD move &nbsp;•&nbsp; mouse aim, click fire &nbsp;•&nbsp; Space fires without a mouse &nbsp;•&nbsp; P pause &nbsp;•&nbsp; M mute</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
